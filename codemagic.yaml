workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_WORKSPACE: "TestProject.xcodeproj"
        XCODE_SCHEME: "TestProject"
    scripts:
      - name: Build iOS app
        script: |
          xcodebuild -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            build
    artifacts:
      - build/**/*.app